[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-plugin-bio-thesis"
version = "0.5.0"
description = "Create or audit a Word thesis and repair section margins using your school template"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
bio-thesis = "bio_thesis:main"

[tool.setuptools]
package-dir = { "" = "skills/bio-thesis-formatter/scripts" }
py-modules = ["bio_thesis", "init_thesis_docx", "audit_thesis_docx", "docx_package", "repair_margins"]
